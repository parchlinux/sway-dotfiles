# Alacritty - TOML configuration file format.

[general]
# Import additional configuration files.
# Imports are loaded in order, skipping all missing files, with the importing file being loaded last.
# If a field is already present in a previous import, it will be replaced.
# All imports must either be absolute paths starting with /, paths relative to the user's home directory starting with ~/,
# or paths relative from the current config file.
import = []

# Directory the shell is started in. When this is unset, or "None", the working directory of the parent process will be used.
working_directory = "None"

# Live config reload (changes require restart)
live_config_reload = true

# Offer IPC using alacritty msg (unix only)
ipc_socket = true

[env]
# Example:
# WINIT_X11_SCALE_FACTOR = "1.0"

[window]
# Window dimensions (changes require restart).
# Number of lines/columns (not pixels) in the terminal. Both lines and columns must be non-zero for this to take effect.
# The number of columns must be at least 2, while using a value of 0 for columns and lines will fall back to the window manager's recommended size.
dimensions = { columns = 80, lines = 20 }

# Window startup position. Specified in number of pixels.
# If the position is "None", the window manager will handle placement.
# (has no effect on Wayland)
position = "None"

# Blank space added around the window in pixels. This padding is scaled by DPI and the specified value is always added at both opposing sides.
padding = { x = 2, y = 0 }

# Spread additional padding evenly around the terminal content.
dynamic_padding = false

# Window decorations.
# "Full" - Borders and title bar.
# "None" - Neither borders nor title bar.
# "Transparent" (macOS only) - Title bar, transparent background and title bar buttons.
# "Buttonless" (macOS only) - Title bar, transparent background and no title bar buttons.
decorations = "Full"

# Background opacity as a floating point number from 0.0 to 1.0.
# The value 0.0 is completely transparent and 1.0 is opaque.
opacity = 0.8

# Request compositor to blur content behind transparent windows.
# (works on macOS/KDE Wayland)
blur = false

# Startup mode (changes require restart)
# "Windowed" - Regular window.
# "Maximized" - The window will be maximized on startup.
# "Fullscreen" - The window will be fullscreened on startup.
# "SimpleFullscreen" (macOS only) - Same as Fullscreen, but you can stack windows on top.
startup_mode = "Windowed"

# Window title.
title = "Alacritty"

# Allow terminal applications to change Alacritty's window title.
dynamic_title = true

# Window class. (Linux/BSD only)
# On Wayland, general is used as app_id and instance is ignored.
class = { instance = "Alacritty", general = "Alacritty" }

# Override the variant of the System theme/GTK theme/Wayland client side decorations.
# Set this to "None" to use the system's default theme variant.
decorations_theme_variant = "Dark"

# Prefer resizing window by discrete steps equal to cell dimensions.
# (works on macOS/X11)
resize_increments = false

# Make Option key behave as Alt. (macOS only)
# "OnlyLeft" - Option key on left side.
# "OnlyRight" - Option key on right side.
# "Both" - Both Option keys.
# "None" - Do not treat Option as Alt.
option_as_alt = "None"

# Sets window level.
# "Normal" - Window adheres to system's default z-order.
# "AlwaysOnTop" - Window is a toplevel window.
level = "Normal"

[scrolling]
# Maximum number of lines in the scrollback buffer.
# Specifying 0 will disable scrolling.
# Limited to 100000.
history = 10000

# Number of line scrolled for every input scroll increment.
multiplier = 1

[font]
# Default font family and style.
normal = { family = "RobotoMono Nerd Font", style = "Medium" }

# Bold font family and style. Falls back to normal if family not specified.
bold = { style = "Bold" }

# Italic font family and style. Falls back to normal if family not specified.
italic = { style = "Italic" }

# Bold italic font family and style. Falls back to normal if family not specified.
bold_italic = { style = "Bold Italic" }

# Font size in points.
size = 14

# Offset is the extra space around each character.
# y can be thought of as modifying the line spacing, and x as modifying the letter spacing.
offset = { x = 0, y = 0 }

# Glyph offset determines the locations of the glyphs within their cells with the default being at the bottom.
# Increasing x moves the glyph to the right, increasing y moves the glyph upward.
glyph_offset = { x = 0, y = 0 }

# When true, Alacritty will use a custom built-in font for box drawing characters (Unicode points U+2500 - U+259F),
# legacy computing symbols (U+1FB00 - U+1FB3B), and powerline symbols (U+E0B0 - U+E0B3).
builtin_box_drawing = true

[colors]
# Colors are specified using their hexadecimal values with a # prefix: #RRGGBB.

[colors.primary]
# Foreground color.
foreground = "#d8d8d8"
# Background color.
background = "#181818"
# Dim foreground color. If not set, calculated based on foreground.
dim_foreground = "#828482"
# Bright foreground color. Used only when draw_bold_text_with_bright_colors is true.
# If not set, normal foreground is used.
bright_foreground = "None"

[colors.cursor]
# Colors for the terminal cursor.
text = "CellBackground"
cursor = "CellForeground"

[colors.vi_mode_cursor]
# Colors for the cursor when vi mode is active.
text = "CellBackground"
cursor = "CellForeground"

[colors.search]
# Colors for search matches.
matches = { foreground = "#181818", background = "#ac4242" }
# Color for the focused match.
focused_match = { foreground = "#181818", background = "#f4bf75" }

[colors.hints]
# Colors for hint labels.
start = { foreground = "#181818", background = "#f4bf75" }
# All characters after the first in the hint label.
end = { foreground = "#181818", background = "#ac4242" }

# Color used for the indicator displaying the position in history during search and vi mode.
# Setting this to "None" will use the opposing primary color.
line_indicator = { foreground = "None", background = "None" }

# Color used for the footer bar on the bottom, used by search regex input, hyperlink URI preview, etc.
footer_bar = { foreground = "#181818", background = "#d8d8d8" }

[colors.selection]
# Colors used for drawing selections.
text = "CellBackground"
background = "CellForeground"

[colors.normal]
# Standard colors (16-color palette).
black = "#181818"
red = "#ac4242"
green = "#90a959"
yellow = "#f4bf75"
blue = "#6a9fb5"
magenta = "#aa759f"
cyan = "#75b5aa"
white = "#d8d8d8"

[colors.bright]
# Bright colors (16-color palette).
black = "#6b6b6b"
red = "#c55555"
green = "#aac474"
yellow = "#feca88"
blue = "#82b8c8"
magenta = "#c28cb8"
cyan = "#93d3c3"
white = "#f8f8f8"

[colors.dim]
# Dim colors (16-color palette). If not set, calculated from normal colors.
black = "#0f0f0f"
red = "#712b2b"
green = "#5f6f3a"
yellow = "#a17e4d"
blue = "#456877"
magenta = "#704d68"
cyan = "#4d7770"
white = "#8e8e8e"

# The indexed colors include all colors from 16 to 256. When these are not set, they're filled with sensible defaults.
indexed_colors = []

# Whether or not window.opacity applies to all cell backgrounds, or only to the default background.
# When set to true, all cells will be transparent regardless of their background color.
transparent_background_colors = false

# When true, bold text is drawn using the bright color variants.
draw_bold_text_with_bright_colors = false

[bell]
# Visual bell animation effect for flashing the screen when the visual bell is rung.
animation = "Linear"

# Duration of the visual bell flash in milliseconds. A duration of 0 will disable the visual bell animation.
duration = 0

# Visual bell animation color.
color = "#ffffff"

# This program is executed whenever the bell is rung.
# When set to "None", no command will be executed.
command = "None"

[selection]
# This string contains all characters that are used as separators for "semantic words" in Alacritty.
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

# When set to true, selected text will be copied to the primary clipboard.
save_to_clipboard = false

[cursor]
# Cursor shape and blinking.
style = { shape = "Beam", blinking = "Always" }

# Cursor style when vi mode is active. Falls back to normal cursor if "None".
vi_mode_style = "None"

# Cursor blinking interval in milliseconds.
blink_interval = 400

# Time after which cursor stops blinking, in seconds. Specifying 0 will disable timeout for blinking.
blink_timeout = 5

# When true, the cursor will be rendered as a hollow box when the window is not focused.
unfocused_hollow = true

# Thickness of the cursor relative to the cell width as floating point number from 0.0 to 1.0.
thickness = 0.15

[terminal]
# Shell to execute. Can be a string or an object with program and args.
shell = { program = "$SHELL", args = [] }

# Controls the ability to write to the system clipboard with the OSC 52 escape sequence.
# "Disabled" - No clipboard access.
# "OnlyCopy" - Allow copying to clipboard.
# "OnlyPaste" - Allow pasting from clipboard.
# "CopyPaste" - Allow both.
osc52 = "OnlyCopy"

[mouse]
# When true, the cursor is temporarily hidden when typing.
hide_when_typing = false

# Mouse button bindings.
bindings = []

[hints]
# Keys used for the hint labels.
alphabet = "jfkdls;ahgurieowpq"

# Array with all available hints.
[[hints.enabled]]
# Command to execute when hint is clicked or selected.
command = "xdg-open"
# On Linux/BSD
# command = "open"
# On macOS
# command = { program = "cmd", args = ["/c", "start", ""] }
# On Windows
hyperlinks = true
post_processing = true
persist = false
mouse = { enabled = true }
binding = { key = "O", mods = "Control|Shift" }
regex = "^(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\-\\u001F\\u007F-\\u009F<>\"\\\\s{-}\\^⟨⟩`\\\\]+$"

[keyboard]
# Key bindings.
bindings = []

[debug]
# Display the time it takes to draw each frame.
render_timer = false

# Keep the log file after quitting Alacritty.
persistent_logging = false

# Log level: "Off", "Error", "Warn", "Info", "Debug", "Trace".
log_level = "Warn"

# Force use of a specific renderer. "None" uses the highest available one.
renderer = "None"

# Log all received window events.
print_events = false

# Highlight window damage information.
highlight_damage = false

# Use EGL as display API if the current platform allows it.
# Note that transparency may not work with EGL on Linux/BSD.
prefer_egl = false
